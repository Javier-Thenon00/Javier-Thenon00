<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="420" viewBox="0 0 1500 420" role="img" aria-labelledby="title desc">
<title id="title">Javier Thenon — Tecnología y aprendizaje</title>
<desc id="desc">Banner oscuro moderno con acentos turquesa y elementos geométricos.</desc>
<defs>
